[project]
name = "prismsense"
version = "3.0.0"
description = "PrismSense multi-agent research workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django>=5.2,<6.0",
    "requests>=2.32,<3.0",
    "google-auth>=2.40,<3.0",
    "redis>=5.2,<7.0",
    "gunicorn>=22.0,<24.0",
    "whitenoise>=6.9,<7.0",
]

[tool.uv]
package = false

[tool.vercel.scripts]
build = "python build_vercel.py"
